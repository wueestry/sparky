name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:?OPEN_WEBUI_TAG must be set in .env}
    container_name: open-webui
    restart: unless-stopped
    networks:
      - traefik
    # Traefik docker-provider labels. Wire open-webui:8080 to
    # https://open-webui.<any-spark-host>.<any-domain>.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.open-webui.rule=HostRegexp(`open-webui.{x:.+}`)"
      - "traefik.http.routers.open-webui.entryPoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      # Models come from the LiteLLM gateway (litellm/), over the shared
      # `traefik` network. No Ollama.
      #
      # NOTE: Open WebUI stores these as "persistent config" — they seed the
      # database on FIRST start, after which the Admin Panel → Settings →
      # Connections values win. Changing them here later has no effect unless
      # you also set ENABLE_PERSISTENT_CONFIG=false or edit them in the UI.
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY must be set in .env (a LiteLLM virtual key, see README)}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set in .env}
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
      ANONYMIZED_TELEMETRY: "false"
      # No "new version available" lookups. The host firewall (firewall/) blocks them
      # anyway; this just stops the failed attempts. (`OFFLINE_MODE=true` goes further
      # and also stops Hugging Face model downloads, which breaks RAG embeddings that
      # are not cached yet, so it is left off.)
      ENABLE_VERSION_UPDATE_CHECK: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Single network shared with traefik and every other stack — open-webui
  # resolves `litellm` by name over it.
  traefik:
    external: true
    name: traefik

volumes:
  # External — host-side persistent state we don't want `docker compose down -v`
  # to ever destroy (Open WebUI users/chats/config).
  open-webui:
    external: true
    name: open-webui
